<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deraya Cafeteria</title>
    <meta name="description" content="Deraya Cafeteria - Delicious food crafted with passion. View our menu, special offers, and contact us.">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <h1>Deraya Cafeteria</h1>
            <nav>
                <a href="#menu">Menu</a>
                <a href="#offers">Offers</a>
                <a href="#contact">Contact</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2>Welcome to Deraya Cafeteria</h2>
            <p>Delicious food crafted with passion and the finest ingredients.</p>
        </div>
    </section>

    <section id="offers" class="section">
        <div class="container">
            <h2 class="section-title">Special Offers</h2>
            <div id="offers-container" class="menu-grid"></div>
        </div>
    </section>

    <section id="menu" class="section bg-light">
        <div class="container">
            <h2 class="section-title">Our Menu</h2>
            <div id="menu-container"></div>
        </div>
    </section>

    <footer id="contact">
        <div class="container">
            <h3>Contact Us</h3>
            <p>Phone: <span id="phone-display">...</span></p>
            <p>&copy; 2026 Deraya Cafeteria. All rights reserved.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
