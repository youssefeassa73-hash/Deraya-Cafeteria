<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة تحضير المطبخ - Deraya Cafeteria</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --primary: #f97316;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --border: #334155;
            --radius: 12px;
            --amber-bg: #78350f;
            --amber-border: #d97706;
            --amber-text: #fef3c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-badge {
            background-color: var(--primary);
            color: white;
            padding: 5px 12px;
            border-radius: var(--radius);
            font-weight: 900;
            font-size: 1.1rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 900;
        }

        .status-tracker {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .pulse-dot {
            width: 12px;
            height: 12px;
            background-color: var(--success);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        /* 2-Column Grid Layout */
        .kds-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            flex-grow: 1;
        }

        .kds-column {
            background-color: rgba(30, 41, 59, 0.4);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 500px;
        }

        .kds-column.ready-column-wrapper {
            border-color: rgba(16, 185, 129, 0.3);
            background-color: rgba(16, 185, 129, 0.02);
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .ready-column-wrapper .column-header {
            border-color: rgba(16, 185, 129, 0.4);
        }

        .column-title {
            font-size: 1.4rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .column-title span.count-badge {
            background-color: var(--border);
            color: var(--text-main);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .preparing-column-wrapper .column-title { color: #f97316; }
        .ready-column-wrapper .column-title { color: #10b981; }

        .preparing-column-wrapper span.count-badge { background-color: rgba(249, 115, 22, 0.2); color: #fdba74; }
        .ready-column-wrapper span.count-badge { background-color: rgba(16, 185, 129, 0.2); color: #6ee7b7; }

        .column-cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            align-content: start;
            flex-grow: 1;
            overflow-y: auto;
        }

        .order-card {
            background-color: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
        }

        /* Specific style for preparing cards */
        .preparing-card {
            border-right: 4px solid var(--primary);
        }
        .preparing-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        /* Pulsing Glow for Ready Cards */
        .ready-card {
            border-color: rgba(16, 185, 129, 0.6);
            border-right: 4px solid var(--success);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
            animation: readyGlow 2.5s infinite;
        }
        .ready-card:hover {
            border-color: var(--success);
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        @keyframes readyGlow {
            0% { box-shadow: 0 0 12px rgba(16, 185, 129, 0.1); }
            50% { box-shadow: 0 0 22px rgba(16, 185, 129, 0.25); }
            100% { box-shadow: 0 0 12px rgba(16, 185, 129, 0.1); }
        }

        .card-header {
            padding: 12px 15px;
            background-color: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-num {
            font-size: 1.4rem;
            font-weight: 900;
        }

        .preparing-card .order-num { color: var(--primary); }
        .ready-card .order-num { color: var(--success); }

        .order-time {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .card-body {
            padding: 15px;
            flex-grow: 1;
        }

        .cust-name {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .items-list {
            font-size: 1.15rem;
            line-height: 1.5;
            font-weight: 600;
            white-space: pre-line;
            background: rgba(0,0,0,0.15);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .comments-box {
            background-color: var(--amber-bg);
            border: 1px dashed var(--amber-border);
            color: var(--amber-text);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.92rem;
            line-height: 1.3;
        }

        .card-footer {
            padding: 12px 15px;
            border-top: 1px solid var(--border);
            background-color: rgba(0, 0, 0, 0.1);
        }

        .action-btn {
            width: 100%;
            border: none;
            padding: 10px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            color: white;
        }

        .preparing-card .action-btn {
            background-color: var(--primary);
        }
        .preparing-card .action-btn:hover {
            background-color: #ea580c;
        }

        .ready-card .action-btn {
            background-color: var(--success);
        }
        .ready-card .action-btn:hover {
            background-color: #059669;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 15px;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 3.5rem;
            margin-bottom: 12px;
        }

        /* Responsive Columns for Mobile */
        @media (max-width: 820px) {
            .kds-grid {
                grid-template-columns: 1fr;
            }
            body {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">
            <span class="logo-badge">المطبخ</span>
            <h1>شاشة تحضير الطلبات 🍳</h1>
        </div>
        <div class="status-tracker">
            <span class="pulse-dot"></span>
            <span id="update-timer">تحديث تلقائي...</span>
        </div>
    </header>

    <div class="kds-grid">
        <!-- Column 1: Preparing -->
        <div class="kds-column preparing-column-wrapper">
            <div class="column-header">
                <div class="column-title">
                    <span>قيد التحضير 👨‍🍳</span>
                    <span class="count-badge" id="prep-count">0</span>
                </div>
            </div>
            <div class="column-cards-container" id="preparing-list">
                <div class="empty-state">
                    <div class="empty-icon">⏳</div>
                    <h2>جاري تحميل الطلبات...</h2>
                </div>
            </div>
        </div>

        <!-- Column 2: Ready for pickup -->
        <div class="kds-column ready-column-wrapper">
            <div class="column-header">
                <div class="column-title">
                    <span>جاهز للاستلام 🔔</span>
                    <span class="count-badge" id="ready-count">0</span>
                </div>
            </div>
            <div class="column-cards-container" id="ready-list">
                <div class="empty-state">
                    <div class="empty-icon">⏳</div>
                    <h2>جاري تحميل الطلبات...</h2>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SANITY_PROJECT_ID = 'ksse299y';
        const SANITY_DATASET = 'production';
        const SANITY_API_VERSION = '2021-06-07';
        const SANITY_WRITE_TOKEN = 'sky3A8Tg8i5MbEfvEdqM5MQ3GDW9iLrXpuWf1b1zFIHPvHsBFMV8G4oZ5xgD8cCrkNEQYcXDCB2IwRXlAygdhalYBkB541di2BB6w7VpJhYjKjPm4nQqLlLhM4xUOcrNuaG1U7Lj4RXfPj5zRkx2uRuU3A3Z9AFIldtqHMQsCCLWe52srfu9';

        async function fetchPaidOrders() {
            // Fetch both "paid" (preparing) and "ready" (pick up) orders
            const query = encodeURIComponent('*[_type == "order" && (status == "paid" || status == "ready")] | order(createdAt asc){_id, orderNumber, customerName, customerPhone, items, comments, createdAt, paidAt, readyAt, status}');
            const url = `https://${SANITY_PROJECT_ID}.api.sanity.io/v${SANITY_API_VERSION}/data/query/${SANITY_DATASET}?query=${query}`;
            
            try {
                const res = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${SANITY_WRITE_TOKEN}`
                    }
                });
                const data = await res.json();
                const orders = data.result || [];
                
                // Automatically stamp any paid orders that don't have paidAt set yet
                const unstampedOrders = orders.filter(o => o.status === 'paid' && !o.paidAt);
                if (unstampedOrders.length > 0) {
                    stampPaidOrders(unstampedOrders);
                }
                
                renderOrders(orders);
            } catch (error) {
                console.error('Error fetching orders:', error);
                const errorHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">❌</div>
                        <h2>خطأ في الاتصال بالخادم.</h2>
                    </div>
                `;
                document.getElementById('preparing-list').innerHTML = errorHTML;
                document.getElementById('ready-list').innerHTML = errorHTML;
            }
        }

        async function stampPaidOrders(ordersToStamp) {
            const url = `https://${SANITY_PROJECT_ID}.api.sanity.io/v${SANITY_API_VERSION}/data/mutate/${SANITY_DATASET}`;
            const patches = ordersToStamp.map(order => ({
                patch: {
                    id: order._id,
                    set: {
                        paidAt: new Date().toISOString()
                    }
                }
            }));

            try {
                await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SANITY_WRITE_TOKEN}`
                    },
                    body: JSON.stringify({ mutations: patches })
                });
                console.log('Stamped paidAt timestamps successfully.');
            } catch (err) {
                console.error('Error stamping paidAt:', err);
            }
        }

        function renderOrders(orders) {
            const prepList = document.getElementById('preparing-list');
            const readyList = document.getElementById('ready-list');
            
            const preparingOrders = orders.filter(o => o.status === 'paid');
            const readyOrders = orders.filter(o => o.status === 'ready');
            
            // Update column badges count
            document.getElementById('prep-count').innerText = preparingOrders.length;
            document.getElementById('ready-count').innerText = readyOrders.length;

            // 1. Render Preparing Orders
            if (preparingOrders.length === 0) {
                prepList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">☕🍔</div>
                        <h2>لا توجد طلبات قيد التحضير.</h2>
                    </div>
                `;
            } else {
                let html = '';
                preparingOrders.forEach(order => {
                    const baseTime = order.paidAt ? new Date(order.paidAt) : new Date(order.createdAt);
                    const timeDiff = Math.round((new Date() - baseTime) / 60000);
                    const timeText = timeDiff <= 0 ? 'الآن' : `منذ ${timeDiff} دقيقة`;
                    
                    let commentsHTML = '';
                    if (order.comments) {
                        commentsHTML = `
                            <div class="comments-box">
                                <strong>💡 ملاحظة العميل:</strong> ${order.comments}
                            </div>
                        `;
                    }
                    
                    const cleanItems = order.items ? order.items.replace(/\s*\(\s*(EGP\s*\d+|\d+\s*EGP)\s*\)/gi, '') : '';
                    
                    html += `
                        <div class="order-card preparing-card" id="card-${order._id}">
                            <div class="card-header">
                                <span class="order-num">#${order.orderNumber}</span>
                                <span class="order-time">${timeText}</span>
                            </div>
                            <div class="card-body">
                                <div class="cust-name">العميل: ${order.customerName}</div>
                                <div class="items-list">${cleanItems}</div>
                                ${commentsHTML}
                            </div>
                            <div class="card-footer">
                                <button class="action-btn" onclick="updateOrderStatus('${order._id}', 'ready')">
                                    <span>جاهز للاستلام 🔔</span>
                                </button>
                            </div>
                        </div>
                    `;
                });
                prepList.innerHTML = html;
            }

            // 2. Render Ready to Pick Up Orders
            if (readyOrders.length === 0) {
                readyList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🛎️</div>
                        <h2>لا توجد طلبات جاهزة للاستلام.</h2>
                    </div>
                `;
            } else {
                let html = '';
                readyOrders.forEach(order => {
                    let commentsHTML = '';
                    if (order.comments) {
                        commentsHTML = `
                            <div class="comments-box">
                                <strong>💡 ملاحظة العميل:</strong> ${order.comments}
                            </div>
                        `;
                    }
                    
                    const cleanItems = order.items ? order.items.replace(/\s*\(\s*(EGP\s*\d+|\d+\s*EGP)\s*\)/gi, '') : '';
                    
                    const baseTime = order.readyAt ? new Date(order.readyAt) : (order.paidAt ? new Date(order.paidAt) : new Date(order.createdAt));
                    const timeDiff = Math.round((new Date() - baseTime) / 60000);
                    const timeText = timeDiff <= 0 ? 'الآن' : `منذ ${timeDiff} دقيقة`;
                    
                    html += `
                        <div class="order-card ready-card" id="card-${order._id}">
                            <div class="card-header">
                                <span class="order-num">#${order.orderNumber}</span>
                                <span class="order-time">${timeText}</span>
                            </div>
                            <div class="card-body">
                                <div class="cust-name">العميل: ${order.customerName}</div>
                                <div class="items-list">${cleanItems}</div>
                                ${commentsHTML}
                            </div>
                            <div class="card-footer">
                                <button class="action-btn" onclick="updateOrderStatus('${order._id}', 'done')">
                                    <span>تم التسليم والإنهاء ✓</span>
                                </button>
                            </div>
                        </div>
                    `;
                });
                readyList.innerHTML = html;
            }
        }

        async function updateOrderStatus(orderId, nextStatus) {
            const button = document.querySelector(`#card-${orderId} .action-btn`);
            if (button) {
                button.disabled = true;
                button.innerText = 'جاري التحديث... ⏳';
            }

            const setFields = { status: nextStatus };
            if (nextStatus === 'ready') {
                setFields.readyAt = new Date().toISOString();
            } else if (nextStatus === 'done') {
                setFields.doneAt = new Date().toISOString();
            }

            const url = `https://${SANITY_PROJECT_ID}.api.sanity.io/v${SANITY_API_VERSION}/data/mutate/${SANITY_DATASET}`;
            const mutations = {
                mutations: [
                    {
                        patch: {
                            id: orderId,
                            set: setFields
                        }
                    }
                ]
            };

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SANITY_WRITE_TOKEN}`
                    },
                    body: JSON.stringify(mutations)
                });
                
                const data = await res.json();
                console.log(`Order status updated to ${nextStatus} successfully:`, data);
                
                // Add slick slide away/fade animation before refreshing
                const card = document.getElementById(`card-${orderId}`);
                if (card) {
                    card.style.transition = 'transform 0.35s, opacity 0.35s';
                    card.style.transform = 'scale(0.9) translateY(-15px)';
                    card.style.opacity = '0';
                    setTimeout(() => {
                        fetchPaidOrders();
                    }, 350);
                }
            } catch (error) {
                console.error(`Error updating order status to ${nextStatus}:`, error);
                alert('حدث خطأ أثناء تحديث حالة الطلب. يرجى المحاولة مرة أخرى.');
                if (button) {
                    button.disabled = false;
                    button.innerText = nextStatus === 'ready' ? 'جاهز للاستلام 🔔' : 'تم التسليم والإنهاء ✓';
                }
            }
        }

        // Fetch on boot
        fetchPaidOrders();

        // Auto-refresh every 15 seconds
        setInterval(fetchPaidOrders, 15000);
    </script>
</body>
</html>
